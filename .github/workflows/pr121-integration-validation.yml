name: PR 121 isolated integration validation
on:
  push:
    branches: ['verify/pr121-integration-20261108']
permissions:
  contents: read
concurrency:
  group: pr121-isolated-validation
  cancel-in-progress: false

env:
  ORIGINAL: 336c709e474b413baec6a25f3ec2022fa402eeae
  UPSTREAM: 532585180b0bfdb8f29b1c3035719a31785c1883

jobs:
  validate:
    if: github.repository == 'zljie/ossie-converters'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout verification tools only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.19'
      - name: Pin sources and preserve verifier outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr121-evidence" "$RUNNER_TEMP/pr121-tools"
          cp .pr121-validation/*.py "$RUNNER_TEMP/pr121-tools/"
          git config user.name 'zljie'
          git config user.email '44569452+zljie@users.noreply.github.com'
          git fetch --no-tags https://github.com/apache/ossie-converters.git "$UPSTREAM"
          git checkout --detach "$UPSTREAM"
          git submodule sync --recursive
          git submodule update --init --recursive
      - name: Test unmodified upstream baseline
        working-directory: dbt
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --python '${{ matrix.python }}'
          uv run --no-sync pytest -q --junitxml="$RUNNER_TEMP/pr121-evidence/baseline.xml" 2>&1 | tee "$RUNNER_TEMP/pr121-evidence/baseline.log"
      - name: Prepare reviewed integration without publishing
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$ORIGINAL"
          git submodule update --init --recursive
          python "$RUNNER_TEMP/pr121-tools/integrate_pr121.py" \
            --repo "$GITHUB_WORKSPACE" \
            --regression-file "$RUNNER_TEMP/pr121-tools/test_ratio_helpers_meta_integration.py" \
            --evidence "$RUNNER_TEMP/pr121-evidence/prepared.json"
          git submodule update --init --recursive
      - name: Run complete dbt suite and cross-feature regressions
        working-directory: dbt
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --python '${{ matrix.python }}'
          uv run --no-sync pytest -q --junitxml="$RUNNER_TEMP/pr121-evidence/integration.xml" 2>&1 | tee "$RUNNER_TEMP/pr121-evidence/integration.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'pr121-evidence' / 'prepared.json'
          data = json.loads(p.read_text())
          data.update(tests_executed=True, baseline_passed=True, integration_passed=True,
                      python_version='${{ matrix.python }}')
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Collect exact staged tree and failure evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr121-evidence"
          git status --porcelain > "$RUNNER_TEMP/pr121-evidence/git-status.txt"
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/pr121-evidence/conflicts.txt"
          git diff --cached "$UPSTREAM" --binary > "$RUNNER_TEMP/pr121-evidence/integration.patch"
          if test -f "$RUNNER_TEMP/pr121-evidence/prepared.json"; then
            git diff --cached --check
            git write-tree > "$RUNNER_TEMP/pr121-evidence/tree-sha.txt"
            git diff --cached --name-only -z "$UPSTREAM" | tar --null -T - -czf "$RUNNER_TEMP/pr121-evidence/changed-files.tar.gz"
          fi
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr121-integration-python-${{ matrix.python }}
          path: ${{ runner.temp }}/pr121-evidence/
          retention-days: 7
          if-no-files-found: error

  publish-candidate:
    needs: validate
    if: github.repository == 'zljie/ossie-converters'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      ORIGINAL_BRANCH: fix/dbt-ratio-private-helpers-20261102
      CANDIDATE_BRANCH: verify/pr121-tested-integration-20261108
    steps:
      - name: Checkout verifier with fork-only publication credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download the four successful validation records
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'pr121-integration-python-*' --dir "$RUNNER_TEMP/pr121-validated"
      - name: Rebuild and compare the exact validated tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin "refs/heads/$ORIGINAL_BRANCH" | cut -f1)" = "$ORIGINAL"
          test "$(git ls-remote --exit-code https://github.com/apache/ossie-converters.git refs/heads/main | cut -f1)" = "$UPSTREAM"
          # The authorized connector imported this exact upstream baseline.
          # This workflow may append dbt changes only, not change workflows.
          test "$(git ls-remote --exit-code origin "refs/heads/$CANDIDATE_BRANCH" | cut -f1)" = "$UPSTREAM"
          mkdir -p "$RUNNER_TEMP/pr121-publish-tools" "$RUNNER_TEMP/pr121-publication"
          cp .pr121-validation/*.py "$RUNNER_TEMP/pr121-publish-tools/"
          git config user.name 'zljie'
          git config user.email '44569452+zljie@users.noreply.github.com'
          git fetch --no-tags https://github.com/apache/ossie-converters.git "$UPSTREAM"
          git checkout --detach "$ORIGINAL"
          git submodule update --init --recursive
          python "$RUNNER_TEMP/pr121-publish-tools/integrate_pr121.py" \
            --repo "$GITHUB_WORKSPACE" \
            --regression-file "$RUNNER_TEMP/pr121-publish-tools/test_ratio_helpers_meta_integration.py" \
            --evidence "$RUNNER_TEMP/pr121-publication/prepared.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path(os.environ['RUNNER_TEMP'])
          output = root / 'pr121-publication/prepared.json'
          expected = json.loads(output.read_text())
          records = list((root / 'pr121-validated').glob('*/prepared.json'))
          if len(records) != 4:
              raise SystemExit('Four complete validation records are required')
          versions = set()
          for path in records:
              record = json.loads(path.read_text())
              versions.add(record['python_version'])
              for field in ('original', 'upstream', 'tree', 'changed_files'):
                  if record[field] != expected[field]:
                      raise SystemExit(f'Tree or source mismatch: {path}: {field}')
              if not all(record.get(k) is True for k in ('tests_executed', 'baseline_passed', 'integration_passed')):
                  raise SystemExit(f'Unverified tests: {path}')
              for filename in ('baseline.xml', 'integration.xml'):
                  report = ET.parse(path.parent / filename).getroot()
                  if not list(report.iter('testcase')) or list(report.iter('failure')) or list(report.iter('error')):
                      raise SystemExit(f'Test evidence failed: {path.parent / filename}')
          if versions != {'3.11', '3.12', '3.13', '3.14'}:
              raise SystemExit('Unexpected Python matrix')
          expected.update(tests_executed=True, baseline_passed=True,
                          integration_passed=True, python_versions=sorted(versions))
          output.write_text(json.dumps(expected, indent=2) + '\n')
          print('All four matrices validated identical tree:', expected['tree'])
          PY
      - name: Publish tested candidate without touching the original PR branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git commit -m 'Merge upstream main and preserve public ratio helper provenance'
          test "$(git show -s --format=%P HEAD)" = "$ORIGINAL $UPSTREAM"
          test "$(git ls-remote --exit-code origin "refs/heads/$ORIGINAL_BRANCH" | cut -f1)" = "$ORIGINAL"
          test "$(git ls-remote --exit-code origin "refs/heads/$CANDIDATE_BRANCH" | cut -f1)" = "$UPSTREAM"
          git diff --quiet "$UPSTREAM" HEAD -- .github
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/pr121-publication/candidate-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/pr121-publication/tree-sha.txt"
          echo "Validated candidate commit: $(git rev-parse HEAD)"
          echo 'Original PR branch was not changed by this workflow.'
      - name: Upload publication record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr121-publication-record
          path: ${{ runner.temp }}/pr121-publication/
          retention-days: 7
          if-no-files-found: warn
