name: PR 121 latest upstream validation
on:
  push:
    branches: ['verify/pr121-upstream-20261110']
permissions:
  contents: read
concurrency:
  group: pr121-20261110
  cancel-in-progress: false
env:
  ORIGINAL: eedd5887b83ffc5dc9d54e23233c619d1cf86ecd
  UPSTREAM: 776e47b9c01230876a81195528059a2b7e7683e5
  ORIGINAL_BRANCH: fix/dbt-ratio-private-helpers-20261102
  CANDIDATE_BRANCH: verify/pr121-tested-20261110
jobs:
  validate:
    if: github.repository == 'zljie/ossie-converters'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.19'
      - name: Pin exact sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cp .pr121-validation/prepare.py "$RUNNER_TEMP/prepare.py"
          git config user.name zljie
          git config user.email '44569452+zljie@users.noreply.github.com'
          git fetch --no-tags https://github.com/apache/ossie-converters.git "$UPSTREAM"
          git checkout --detach "$UPSTREAM"
          git submodule update --init --recursive
      - name: Test latest unmodified upstream baseline
        working-directory: dbt
        run: |
          set -euo pipefail
          uv sync --frozen --python '${{ matrix.python }}'
          uv run --no-sync pytest -q --junitxml="$RUNNER_TEMP/evidence/baseline.xml" 2>&1 | tee "$RUNNER_TEMP/evidence/baseline.log"
      - name: Merge and prepare cross-feature regressions
        run: |
          set -euo pipefail
          git checkout --detach "$ORIGINAL"
          python "$RUNNER_TEMP/prepare.py" "$RUNNER_TEMP/evidence/prepared.json"
          git submodule update --init --recursive
      - name: Test complete integrated dbt suite
        working-directory: dbt
        run: |
          set -euo pipefail
          uv sync --frozen --python '${{ matrix.python }}'
          uv run --no-sync pytest -q --junitxml="$RUNNER_TEMP/evidence/integration.xml" 2>&1 | tee "$RUNNER_TEMP/evidence/integration.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'evidence/prepared.json'
          data = json.loads(p.read_text())
          data.update(passed=True, python='${{ matrix.python }}')
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Collect patch and exact tree
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git status --porcelain > "$RUNNER_TEMP/evidence/status.txt"
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/evidence/conflicts.txt"
          if test -f "$RUNNER_TEMP/evidence/prepared.json"; then
            git diff --cached "$UPSTREAM" --binary > "$RUNNER_TEMP/evidence/integration.patch"
            git diff --cached --name-only -z "$UPSTREAM" | tar --null -T - -czf "$RUNNER_TEMP/evidence/changed-files.tar.gz"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr121-20261110-python-${{ matrix.python }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
  publish-candidate:
    needs: validate
    if: github.repository == 'zljie/ossie-converters'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download evidence and rebuild identical candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'pr121-20261110-python-*' --dir "$RUNNER_TEMP/validated"
          mkdir -p "$RUNNER_TEMP/publication"
          cp .pr121-validation/prepare.py "$RUNNER_TEMP/prepare.py"
          test "$(git ls-remote origin "refs/heads/$ORIGINAL_BRANCH" | cut -f1)" = "$ORIGINAL"
          test "$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | cut -f1)" = "$UPSTREAM"
          test "$(git ls-remote https://github.com/apache/ossie-converters.git refs/heads/main | cut -f1)" = "$UPSTREAM"
          git config user.name zljie
          git config user.email '44569452+zljie@users.noreply.github.com'
          git fetch --no-tags https://github.com/apache/ossie-converters.git "$UPSTREAM"
          git checkout --detach "$ORIGINAL"
          python "$RUNNER_TEMP/prepare.py" "$RUNNER_TEMP/publication/prepared.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path(os.environ['RUNNER_TEMP'])
          expected = json.loads((root/'publication/prepared.json').read_text())
          records = list((root/'validated').glob('*/prepared.json'))
          assert len(records) == 4
          versions = set()
          for path in records:
              data = json.loads(path.read_text())
              assert data['passed'] is True
              versions.add(data['python'])
              for key in ('original', 'upstream', 'tree', 'files'):
                  assert data[key] == expected[key], (key, path)
              for name in ('baseline.xml', 'integration.xml'):
                  report = ET.parse(path.parent/name).getroot()
                  assert list(report.iter('testcase'))
                  assert not any(list(report.iter(tag)) for tag in ('error', 'failure', 'skipped'))
          assert versions == {'3.11', '3.12', '3.13', '3.14'}
          print('All four versions tested identical tree:', expected['tree'])
          PY
      - name: Publish tested candidate only
        run: |
          set -euo pipefail
          git diff --cached --check
          git commit -m 'Merge upstream dbt metadata fixes and verify ratio helper compatibility'
          test "$(git show -s --format=%P HEAD)" = "$ORIGINAL $UPSTREAM"
          git diff --quiet "$UPSTREAM" HEAD -- .github ossie
          test "$(git ls-remote origin "refs/heads/$ORIGINAL_BRANCH" | cut -f1)" = "$ORIGINAL"
          test "$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | cut -f1)" = "$UPSTREAM"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/publication/candidate-sha.txt"
          git show -s --format='%H %T %P' HEAD > "$RUNNER_TEMP/publication/commit-tree-parents.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr121-20261110-publication
          path: ${{ runner.temp }}/publication/
          retention-days: 14
